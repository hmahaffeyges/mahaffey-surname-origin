*{box-sizing:border-box}html,body{margin:0;background:#000;color:#E9DFC8;font-family:"EB Garamond",Georgia,serif}
.stage{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:0 auto;background:#0E1A30;overflow:hidden}

><stop offset="1" stop-color="#DDBE77" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#sky)"/><g fill="#DDBE77" opacity=".8"><circle cx="150" cy="120" r="1.6"/><circle cx="520" cy="80" r="1.4"/><circle cx="900" cy="150" r="1.3"/><circle cx="1300" cy="90" r="1.5"/><circle cx="1500" cy="220" r="1.2"/><circle cx="300" cy="260" r="1.2"/></g><g class="" fill="#0a1224"><path d="M0 800 l32 -114 l32 114 z"/><path d="M50 800 l32 -116 l32 116 z"/><path d="M88 800 l34 -76 l34 76 z"/><path d="M135 800 l40 -85 l40 85 z"/><path d="M193 800 l30 -113 l30 113 z"/><path d="M236 800 l35 -82 l35 82 z"/><path d="M291 800 l29 -118 l29 118 z"/><path d="M334 800 l30 -68 l30 68 z"/><path d="M372 800 l27 -108 l27 108 z"/><path d="M414 800 l30 -111 l30 111 z"/><path d="M464 800 l37 -94 l37 94 z"/><path d="M519 800 l40 -98 l40 98 z"/></g><g class="city"><path d="M820 580 Q1240 340 1660 580 L1660 900 L820 900 z" fill="#1b2b4c"/><g class="bld" fill="#DDBE77"><rect x="1150" y="430" width="26" height="70"/><rect x="1184" y="404" width="32" height="96"/><rect x="1224" y="418" width="24" height="82"/><rect x="1256" y="388" width="38" height="112"/><rect x="1302" y="424" width="26" height="76"/></g><g class="win" fill="#fff8e1"><rect x="1158" y="452" width="5" height="7"/><rect x="1194" y="426" width="6" height="8"/><rect x="1268" y="410" width="7" height="9"/><rect x="1312" y="444" width="5" height="7"/></g><circle class="cityglow" cx="1240" cy="420" r="300" fill="url(#glow)"/></g><path class="draw" d="M700 900 Q690 720 760 620 Q860 520 1220 450" stroke="#C39A3B" stroke-width="14" fill="none" stroke-linecap="round"/><path class="draw darkfade" d="M700 900 Q640 720 520 640 Q400 580 260 600" stroke="#33415c" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="20 16"/><g transform="translate(704 760)"><g class="atfork"><circle cx="0" cy="-36" r="8" fill="#DDBE77"/><path d="M0 -27 v36 M0 9 l-11 28 M0 9 l11 28 M0 -17 l-13 15 M0 -17 l15 11" stroke="#DDBE77" stroke-width="4.5" stroke-linecap="round" fill="none"/></g></g></svg></div><div class="scene" data-id="breaks"><svg viewBox="0 80 1600 900" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1A30"/><stop offset="1" stop-color="#22345e"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#DDBE77" stop-opacity=".6"/><stop offset="1" stop-color="#DDBE77" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#sky)"/><g fill="#DDBE77" opacity=".8"><circle cx="150" cy="120" r="1.6"/><circle cx="520" cy="80" r="1.4"/><circle cx="900" cy="150" r="1.3"/><circle cx="1300" cy="90" r="1.5"/><circle cx="1500" cy="220" r="1.2"/><circle cx="300" cy="260" r="1.2"/></g><g class="roadperson" fill="none" stroke="#C39A3B" stroke-width="10" stroke-linecap="round"><path class="draw" d="M200 860 Q500 760 800 640"/><path class="draw" d="M1400 860 Q1100 760 800 640"/><path class="draw" d="M800 640 v-120"/><path class="draw" d="M800 560 q-40 -120 40 -160"/><path class="draw" d="M800 520 L560 380 M800 520 L1040 380"/><circle class="head" cx="800" cy="330" r="46" stroke-width="10"/></g><g class="cross2" transform="translate(800 720)"><rect x="-8" y="-120" width="16" height="150" fill="#8F1D22"/><rect x="-50" y="-80" width="100" height="16" fill="#8F1D22"/></g></svg></div><div class="scene" data-id="enter"><svg viewBox="0 80 1600 900" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1A30"/><stop offset="1" stop-color="#22345e"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#DDBE77" stop-opacity=".6"/><stop offset="1" stop-color="#DDBE77" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="url(#sky)"/><g fill="#DDBE77" opacity=".8"><circle cx="150" cy="120" r="1.6"/><circle cx="520" cy="80" r="1.4"/><circle cx="900" cy="150" r="1.3"/><circle cx="1300" cy="90" r="1.5"/><circle cx="1500" cy="220" r="1.2"/><circle cx="300" cy="260" r="1.2"/></g><g class="nav" transform="translate(300 180)"><rect width="1000" height="540" rx="24" fill="#111f3a" stroke="#DDBE77" stroke-width="3"/><rect x="40" y="40" width="920" height="80" rx="12" fill="#0a1224"/><text x="70" y="93" font-family="Frank Ruhl Libre,serif" font-size="34" fill="#8b93a7">Destination:</text><text class="typed2" x="290" y="93" font-family="Frank Ruhl Libre,serif" font-size="40" fill="#DDBE77"></text><rect class="cursor" x="290" y="60" width="4" height="44" fill="#DDBE77"/><path class="draw route2" d="M120 470 Q400 420 600 300 Q760 200 900 180" stroke="#C39A3B" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="120" cy="470" r="14" fill="#8F1D22"/><circle class="dest2" cx="900" cy="180" r="18" fill="#DDBE77"/></g><g class="seal"><text x="800" y="820" text-anchor="middle" font-family="Frank Ruhl Libre,serif" font-size="30" fill="#DDBE77" letter-spacing="6">THE CITY  ·  THE ROAD  ·  THE BUILDER WHO CAME OUT</text></g></svg></div><div class="title" id="title">All Roads Lead to Rome</div><div class="cap" id="cap"></div></div><div class="ctrl" id="ctrl"><button id="restart">Restart</button><button id="prev">&larr; Scene</button><button id="pp">Play</button><button id="next">Scene &rarr;</button><span class="t" id="tt">0:00 / 13:08</span><button id="hide" title="Hide controls (press h to toggle)">Hide controls</button></div><script>
const S=[{"id": "club", "title": "The picture you were given", "dur": 42, "lines": [[0, "If you're outside Christianity, the picture you were given probably looks like this."], [5, "A club. A doorman. People inside who believe the right things, looking down on everyone who doesn't."], [12, "Membership earned by rules, kept by guilt, enforced by a furnace."], [18, "Almost every part of that picture is backward."], [22, "So let's put it down, and try another one. An old one."], [27, "Before Christians were called Christians, they called their faith \"the Way.\""], [33, "The word they used was the ordinary Greek word for a road."]]}, {"id": "map", "title": "The map", "dur": 44, "lines": [[0, "Here's the map. There's a destination."], [4, "Call it Rome, because the old proverb does."], [8, "The Bible calls it the kingdom of God, the Father's house, and, most simply, being with him."], [15, "Everything that isn't the road is the wilderness. It's where the human race lives."], [21, "It's dark, it has predators, and it goes nowhere."], [27, "And there's a proverb: all roads lead to Rome."], [33, "It was true for exactly one reason. Rome built them."]]}, {"id": "otherroads", "title": "Aren't all roads the same?", "dur": 74, "lines": [[0, "Before the story, the objection, because it comes up the moment anyone says \"one road.\""], [6, "If Jesus is the only way, are all the other religions simply wrong? And are the people walking them headed to hell?"], [14, "The problem isn't with the answer. It's with the question. It assumes everyone is climbing the same summit by different paths."], [22, "That's the arrogant assumption: that none of the travelers knows where he's going, and only the questioner can see the top."], [29, "Christians aren't claiming to be the only ones on the right path in a contest. They're saying the one who lives at the end of the road came out and showed it, because he wants to live with us."], [39, "All roads led to Rome because Rome built them. And the religions aren't heading to the same place. The Buddhist road is built toward extinction of the self. The Hindu road toward absorption into the One."], [50, "The Muslim road toward a garden awarded on deeds. The Christian road toward a person: knowing the God who made you, as yourself, forever."], [59, "So \"only\" was never about the size of the door. It was about who built it. And he said the door was for anyone."], [67, "As for the people who never heard: hold that question. The road was there before it was lit, and people have walked it in the dark."]]}, {"id": "garden", "title": "How we got into the wilderness", "dur": 50, "lines": [[0, "The Bible's first road is a closed one."], [4, "When the man and the woman leave the garden, God sets a flaming sword \"to guard the way to the tree of life.\""], [12, "The way. The road. Barred."], [17, "What opened the gate to the wilderness wasn't a rule broken for its own sake. The offer was, \"you will be like God.\""], [25, "They chose to be their own destination."], [29, "And the road home closed behind them: not out of spite, but because a creature that has made itself the center can't stand in the presence of the real one."], [41, "That's why the world is like this. We're all born east of the garden, on roads that wind."]]}, {"id": "homesick", "title": "Why you already miss the City", "dur": 40, "lines": [[0, "Here's a fact about you the wilderness can't explain."], [4, "You're homesick for a place you've never been."], [9, "Everyone is."], [12, "Augustine wrote, \"You have made us for yourself, and our heart is restless until it rests in you.\""], [20, "Ecclesiastes says God \"has put eternity into man's heart.\""], [26, "The restlessness isn't a defect. It's a compass, pointing at a city you were made for, before you know its name."]]}, {"id": "survey", "title": "The road surveyed before it was lit", "dur": 50, "lines": [[0, "The road didn't begin with Jesus."], [3, "It was surveyed two thousand years earlier, and the survey crew was Israel."], [10, "The law was the guardrails. The prophets kept pointing down the road, describing the city."], [18, "The temple was a model of the city, built in the wilderness so people could see what they were walking toward."], [27, "And the sacrifices taught, every morning, that there was a chasm ahead, and crossing it would cost a life."], [36, "People walked that road in the dark. Abraham. Ruth. David."], [42, "Some arrived. It was possible. It wasn't likely."]]}, {"id": "builder", "title": "The Builder walks the road", "dur": 46, "lines": [[0, "Then, at a datable point in history, the one who built the road came out along it in person."], [8, "Every other account of God expects you to climb to the city on your own legs, and God waits at the top."], [16, "In this one, the king of the city walked out to the last milestone, where the people were who couldn't walk at all, and was born there."], [26, "In a stable. To a poor family. In an occupied province."], [32, "He walked the road as a traveler for thirty-three years. He got tired. He wept at a friend's grave. He was betrayed."]]}, {"id": "chasm", "title": "The chasm", "dur": 54, "lines": [[0, "And he walked it to the end. Which is the chasm."], [5, "Every traveler before him had stopped at death, because no one crosses it."], [11, "He walked into it."], [14, "On a hill by a road outside Jerusalem, he was executed the way the empire killed slaves."], [21, "The Bible says what that was: the Builder carrying the road across the gap, at his own expense."], [30, "Not because someone had to be punished. Because forgiveness always costs the forgiver, and the one who was owed chose to pay."], [42, "The bridge over the chasm is made of his body. That's what the cross is."]]}, {"id": "sunday", "title": "Sunday morning", "dur": 40, "lines": [[0, "Then, on the third day, he came out the other side."], [5, "That's what the resurrection is: the road, proven. It goes through death."], [12, "The first traveler to make the whole journey stood in a garden on Sunday morning with the tomb open behind him."], [21, "From that morning, the road ran, tested, from the wilderness to the city."], [28, "The word \"gospel\" means news. The news is: the road goes all the way, and it was built for you."]]}, {"id": "guide", "title": "The Guide gets in the car", "dur": 50, "lines": [[0, "He didn't leave the travelers to find their own way. He sent a Guide."], [6, "\"He will guide you into all the truth.\" The word means to lead someone along a road."], [13, "Think of the navigation system in your pocket. It knows every mile. It speaks at the forks."], [21, "When you take a wrong turn, it recalculates, without complaint, and says, \"make a U-turn when possible.\""], [31, "And it never takes the wheel. Direction stays yours."], [37, "Christianity isn't people who handed over their will. It's people who entered a destination and were given a companion who knows the way."]]}, {"id": "destination", "title": "Entering the destination", "dur": 52, "lines": [[0, "Here's the center, and it's where the club picture is most wrong."], [5, "The club says: earn your way in."], [9, "The road says: the road is built, the toll is paid, the Guide is waiting. The one thing required of you is a destination."], [19, "Enter the city. Enter him. That's what \"believe\" means. It's not an achievement. It's a facing."], [28, "The last person Jesus spoke to before he died was a criminal on the next cross, with hours to live and nothing to offer."], [37, "He said one sentence: \"Jesus, remember me.\" No baptism. No works. One entry in the field."], [45, "And the answer came before sunset: \"Today you will be with me in Paradise.\""]]}, {"id": "caravan", "title": "Walking it", "dur": 50, "lines": [[0, "There is walking. The walking doesn't buy the road. It's what trusting looks like from outside."], [8, "And the walking has a shape: the beggar on the side of the road. The Samaritan who stopped."], [15, "\"I was hungry and you gave me food.\" Whoever is in the ditch beside the road you're on is your neighbor."], [23, "And \"some have entertained angels unawares.\""], [28, "You don't walk alone. The road was built for caravans, with way-stations a day apart, where travelers eat at one table and carry their wounded."], [40, "That's the church. Not a club. A caravan that takes anyone who says he wants to go to Rome."]]}, {"id": "wrong", "title": "Wrong turns and robbers", "dur": 66, "lines": [[0, "A road that open will have thieves on it, because thieves go where the travelers are."], [7, "Predators hide among the sheep because the sheep don't check credentials at the gate."], [13, "That openness is the thing they exploit, and the thing that makes it Christianity."], [20, "And every traveler wanders. Sin is leaving the road for the wilderness. Repentance is the U-turn."], [28, "Forgiveness is recalculation without penalty, because the toll was paid in advance."], [35, "So can you wander off whenever you like, since the voice always recalculates? You can."], [41, "But while you're out there, the wilderness is what you've entered as your destination, whatever your mouth says."], [48, "A traveler who lives in the wilderness and keeps Christ as a trail of breadcrumbs to find his way back has entered the wilderness as his destination and Jesus as his exit."], [57, "What matters isn't how many recalculations there were. It's what stays entered. And only God can see that."]]}, {"id": "fork", "title": "The end of both roads", "dur": 46, "lines": [[0, "Death is the moment direction becomes destination. Nobody ends up somewhere he wasn't heading."], [9, "Hell isn't a furnace God stokes. It's where the other road goes: the dark outside a lit house where a feast is going on."], [19, "And the door, as Lewis said, is locked from the inside."], [24, "And heaven is Rome. Not a cloud. A city, come down onto a remade earth, with the tree of life standing in it."], [34, "The one whose road was guarded with a sword in the first book, open in the last. And the King in the middle, who was the destination all along."]]}, {"id": "breaks", "title": "Where the picture breaks", "dur": 40, "lines": [[0, "Every picture breaks somewhere, and this one breaks in the places that matter."], [6, "The road is a person. \"I am the way.\" The Guide is a person. The city is a person. \"That where I am, you may be also.\""], [17, "And the Builder died on his own road. No engineer does that."], [23, "This one came as the poorest traveler on it, and paid the toll with his blood, for travelers who mostly didn't know his name."], [33, "No analogy carries that. It's the thing the analogy was for."]]}, {"id": "enter", "title": "How to enter it now", "dur": 44, "lines": [[0, "If you've watched this far, you're standing at the fork, which is where everyone stands."], [7, "The road is where it always was. The toll is paid. The Guide is waiting. The caravan will take you as you are."], [16, "What's required is a destination. Not a performance. Not a rulebook. A turn toward him, and meaning it."], [25, "The thief said it in a sentence, and it was enough."], [30, "You weren't made for the wilderness. You were made to know him. And he came out to find you."], [38, "The road is under your feet."]]}];let cur=-1,playing=false,t0=0,elapsed=0,raf=null,capTimer=null;
const stage=document.getElementById('stage'),cap=document.getElementById('cap'),title=document.getElementById('title'),bar=document.getElementById('bar'),tt=document.getElementById('tt'),ctrl=document.getElementById('ctrl');
function typeInto(sel,text,delay){const el=document.querySelector('.scene.active '+sel);if(!el)return;el.textContent='';let i=0;setTimeout(function step(){if(i<text.length){el.textContent+=text[i++];setTimeout(step,140)}},delay*1000)}
function show(i){cur=i;document.querySelectorAll('.scene').forEach((s,k)=>{s.classList.toggle('active',k===i);if(k===i){const c=s.cloneNode(true);s.replaceWith(c)}});title.textContent=(i+1)+'. '+S[i].title;elapsed=0;t0=performance.now();cap.classList.remove('show');
 if(S[i].id==='destination')typeInto('.typed','JESUS',19);if(S[i].id==='enter')typeInto('.typed2','JESUS, REMEMBER ME',25);tick();}
function tick(){if(raf)cancelAnimationFrame(raf);const loop=()=>{if(!playing)return;const e=(performance.now()-t0)/1000;elapsed=e;const sc=S[cur];let line=null;for(const l of sc.lines){if(e>=l[0])line=l[1]}
 if(line&&cap.textContent!==line){cap.textContent=line;cap.classList.add('show')}
 bar.style.width=Math.min(100,e/sc.dur*100)+'%';tt.textContent=fmt(totalBefore(cur)+e)+' / '+fmt(totalBefore(S.length));
 if(e>=sc.dur){if(cur<S.length-1){show(cur+1)}else{playing=false;setPlayBtn()}return}raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)}
function totalBefore(i){let s=0;for(let k=0;k<i;k++)s+=S[k].dur;return s}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function play(){if(playing)return;playing=true;if(cur<0)show(0);else{t0=performance.now()-elapsed*1000;tick()}setPlayBtn()}
function pause(){playing=false;setPlayBtn();document.querySelectorAll('.scene.active *').forEach(el=>el.style.animationPlayState='paused')}
function resume(){document.querySelectorAll('.scene.active *').forEach(el=>el.style.animationPlayState='');play()}
function setPlayBtn(){document.getElementById('pp').textContent=playing?'Pause':'Play'}
document.getElementById('pp').onclick=()=>playing?pause():resume();
document.getElementById('restart').onclick=()=>{playing=true;show(0);setPlayBtn()};
document.getElementById('prev').onclick=()=>{playing=true;show(Math.max(0,cur-1));setPlayBtn()};
document.getElementById('next').onclick=()=>{playing=true;show(Math.min(S.length-1,cur+1));setPlayBtn()};
document.getElementById('hide').onclick=()=>ctrl.classList.add('hide');
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?pause():resume()}if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='h')ctrl.classList.toggle('hide')});
stage.addEventListener('dblclick',()=>{if(stage.requestFullscreen)stage.requestFullscreen()});
</script></body></html>
